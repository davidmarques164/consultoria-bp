# Gera o APK do app do celular sem usar a cota de builds do Expo.
# Roda a cada push que mexe no app, pelo botão "Run workflow" na aba Actions e em tag v*. O APK fica em Artifacts; numa tag vira Release.
# Segredos (ver docs/APK_GITHUB.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD e, se o app usar, GOOGLE_SERVICES_JSON (conteúdo do google-services.json).
name: App do celular (APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode fixo (vazio = automático)'
        required: false
        default: ''
  push:
    branches: [main, exe-desktop]
    tags: ['v*']
    paths:
      - 'consultoria-bp/app/**'
      - '.github/workflows/apk-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: consultoria-bp/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: consultoria-bp/app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar o app
        run: npm ci

      - name: Testes do app
        run: npm run teste:fase-a

      - name: Arquivos que não vão para o repositório
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta o segredo ANDROID_KEYSTORE_BASE64 (ver docs/APK_GITHUB.md)"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.jks"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - name: Projeto Android
        run: npx expo prebuild -p android --no-install --clean

      - name: Assinatura e versão
        env:
          BP_KEYSTORE_PATH: ${{ runner.temp }}/app.jks
          BP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode maior que o dos APKs do EAS, para instalar por cima: 1.5.2 -> 105020NN (NN = número da execução)
          VERSAO=$(grep -oE "version: '[0-9]+\.[0-9]+\.[0-9]+'" app.config.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          IFS=. read MA MI PA <<< "$VERSAO"
          export BP_VERSION_CODE=$(( 100000000 + MA*1000000 + MI*10000 + PA*100 + GITHUB_RUN_NUMBER % 100 ))
          if [ -n "${{ github.event.inputs.version_code }}" ]; then export BP_VERSION_CODE=${{ github.event.inputs.version_code }}; fi
          echo "Versão $VERSAO, versionCode $BP_VERSION_CODE"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          node scripts/assinar-android.js

      - name: Gerar o APK
        env:
          BP_KEYSTORE_PATH: ${{ runner.temp }}/app.jks
          BP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk "../apk/Consultoria-BP-$VERSAO-recuperacao.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Consultoria-BP-Android
          path: consultoria-bp/app/apk/*.apk
          if-no-files-found: error

      - name: Release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: consultoria-bp/app/apk/*.apk
